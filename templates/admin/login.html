{% extends "base.html" %}

{% block title %}Admin Portal Login | Campus Sentinel{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 to-teal-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Back Link -->
    <a href="{{ url_for('index') }}" class="inline-flex items-center gap-2 text-sm text-gray-600 hover:text-gray-900 mb-8 transition-smooth">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      Back to home
    </a>

    <!-- Card -->
    <div class="p-8 bg-white rounded-xl shadow-lg border border-gray-200">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="flex justify-center mb-4">
          <div class="p-3 bg-teal-100 rounded-lg text-teal-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
          </div>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Admin & Clinic Portal</h1>
        <p class="text-sm text-gray-500">Healthcare professional access</p>
      </div>

      <!-- Form -->
      <form method="POST" action="{{ url_for('admin_login') }}" class="space-y-4">
        <div>
          <label class="text-sm font-medium block text-gray-700 mb-2">Email</label>
          <input type="email" name="email" value="admin@clinic.edu" required
                 placeholder="admin@clinic.edu"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm" />
        </div>

        <div>
          <label class="text-sm font-medium block text-gray-700 mb-2">Password</label>
          <input type="password" name="password" value="admin123" required
                 placeholder="••••••••"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm" />
        </div>

        <button type="submit" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-lg text-sm transition-smooth shadow">
          Sign In
        </button>
      </form>

      <!-- Demo Box -->
      <div class="mt-6 pt-6 border-t border-gray-200 text-center">
        <p class="text-xs text-gray-500 font-semibold mb-2">Demo Credentials</p>
        <p class="text-xs text-gray-600">Email: admin@clinic.edu</p>
        <p class="text-xs text-gray-600">Password: admin123</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
