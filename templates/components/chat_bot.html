<!-- MedicBot Floating AI Chat Assistant Widget -->
<!-- Floating Launcher Button -->
<button id="medicbot-toggle-btn"
        class="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-lg flex items-center justify-center transition-all transform hover:scale-110"
        aria-label="Open MedicBot chat">
  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
  </svg>
</button>

<!-- Chat Drawer Window -->
<div id="medicbot-drawer" class="hidden fixed bottom-6 right-6 z-40 w-96 max-w-full h-96 flex flex-col bg-white dark:bg-slate-950 rounded-lg shadow-2xl border border-gray-200 dark:border-gray-800">
  <!-- Header -->
  <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-slate-900 rounded-t-lg">
    <div>
      <p class="font-semibold text-sm text-gray-900 dark:text-gray-100">MedicBot</p>
      <p class="text-xs text-gray-500">AI Health Assistant</p>
    </div>
    <button id="medicbot-close-btn" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Messages List -->
  <div id="chat-messages-list" class="flex-1 overflow-y-auto p-4 space-y-3">
    <div class="flex justify-start">
      <div class="max-w-xs px-3 py-2 rounded-lg text-sm bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-gray-100">
        Hi! I'm MedicBot. I'm here to answer health-related questions and provide guidance. How can I help you today?
      </div>
    </div>
  </div>

  <!-- Chat Input Footer -->
  <div class="p-3 border-t border-gray-200 dark:border-gray-800 flex gap-2">
    <input type="text" id="chat-input-field" placeholder="Ask MedicBot..." class="flex-1 px-3 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm bg-white dark:bg-slate-900 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
    <button id="chat-send-btn" class="px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm flex items-center justify-center">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
      </svg>
    </button>
  </div>
</div>
